name: GEL
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "23 5 * * 1" # weekly, so the dashboard record never expires (artifacts last 30 days)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gel-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gel:
    permissions: { contents: read, checks: read, pull-requests: read }
    uses: flisk-sh/gel/.github/workflows/gel.yml@aa771a8f5b779dcd56365bf04b6681461f3b2908 # v1.6.0
    with: { gel_ref: aa771a8f5b779dcd56365bf04b6681461f3b2908 }
