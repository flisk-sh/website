# Measures this repo's north star (north_star.measure in docs/gel.json) every Monday and publishes the number, with this
# run's link, to the north-star branch. The GEL north-star guard and Cilytics read it there. A missed target turns the run red.
name: North star

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: north-star
  cancel-in-progress: false

jobs:
  measure:
    permissions:
      contents: write
    uses: flisk-sh/gel/.github/workflows/north-star.yml@382f39a61785c15f0f3cab97ee4afdb83a2cc08f # main, north-star keeps a measure's failure (gel#68)
    with:
      gel_ref: 382f39a61785c15f0f3cab97ee4afdb83a2cc08f
      timeout: 20
      setup: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.65.0 && node node_modules/playwright-core/cli.js install --with-deps chromium
