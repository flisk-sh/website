name: Site

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true
      - name: Test the claims check
        run: node --test scripts/check-claims.test.mjs
      - name: Test the llms demo sync
        run: node --test scripts/sync-llms-demos.test.mjs
      - name: Test the corner radius check
        run: node --test scripts/check-radius.test.mjs
      - name: Check every corner radius is the sharp token
        run: node scripts/check-radius.mjs
      - name: Check registered public claims
        run: node scripts/check-claims.mjs
      - name: Test the header menu data
        run: ruby test/nav_data_test.rb
      - name: Build site
        run: bundle exec jekyll build
      - name: Check every built page for forbidden claims
        run: node scripts/check-claims.mjs --built
