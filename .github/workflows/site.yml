name: Site

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true
      - name: Test the claims check
        run: node --test scripts/check-claims.test.mjs
      - name: Check registered public claims
        run: node scripts/check-claims.mjs
      - name: Build site
        run: bundle exec jekyll build
      - name: Check every built page for forbidden claims
        run: node scripts/check-claims.mjs --built
