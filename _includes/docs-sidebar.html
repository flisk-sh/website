<aside class="aw-docs-side">

  <a class="aw-docs-search-open" data-docs-search href="https://helpdock.flisk.si/flisk-sh/flisk/tree/main/docs/" target="_blank" rel="noopener">
    <span>Search the docs</span><kbd>/</kbd>

    <a href="{{ '/docs/' | relative_url }}" class="{% if page.url == '/docs/' %}is-active{% endif %}">Overview</a>

    <a href="{{ '/docs/configuration/' | relative_url }}" class="{% if page.url contains '/docs/configuration/' %}is-active{% endif %}">Configuration</a>
    <a href="{{ '/docs/scripts/' | relative_url }}" class="{% if page.url contains '/docs/scripts/' %}is-active{% endif %}">package.json Scripts</a>

    <a href="{{ '/docs/agents/' | relative_url }}" class="{% if page.url contains '/docs/agents/' %}is-active{% endif %}">AI Agents &amp; Skills</a>
    <a href="{{ '/docs/with-helm/' | relative_url }}" class="{% if page.url contains '/docs/with-helm/' %}is-active{% endif %}">With Helm</a>
