  - "AGENTS.md for AI assistants"
  - "Discovery daemon + flisk doctor"

waitlist_features:         # static checkbox options (2 dynamic ones stay in HTML)
  - "No Kubernetes"
  - "14-service warm start (images already built)"
  - "Golden Docker L1-L4"
  - "Infisical identities"
  - "C4 diagrams + AGENTS.md"
  - "DDD scaffolding"
  - "Terminal UI + doctor"
  - "Selective startup"
  - "Vite + Hot Reload"
  - "Prisma + PostgreSQL"
  - "E2E Playwright tests"

manifest_features:         # service.json "featuresEnabled": the exact enum in engine/schemas/service-schema.json
  - name: "nats"
    desc: "NATS JetStream eventing. Flisk injects TILT_NATS_URL; you provide the broker (see the auth + queue + email example)"
  - name: "prisma"
    desc: "Database ORM and migrations"
  - name: "redis"
    desc: "Caching layer"
  - name: "infisical"
    desc: "Secrets management"
  - name: "vitest"
    desc: "Test framework"
  - name: "traefik"
    desc: "Reverse-proxy routing"
  - name: "websocket"
    desc: "WebSocket support"
  - name: "graphql"
    desc: "GraphQL server"
  - name: "grpc"
    desc: "gRPC protocol"

frontend_frameworks:       # service.json "framework" (frontend resources only) - used in /docs/configuration/
  - name: "react"
    desc: "React + Vite. The default when framework is omitted, so older manifests keep working"
  - name: "vue"
    desc: "Vue 3 + Vite (@vitejs/plugin-vue). Scaffold with flisk resource web --type frontend --framework vue"

app_types:                 # service.json "appType" — used in /docs/configuration/
  - name: "backend"
    desc: "API service"
  - name: "frontend"
    desc: "Web application"
  - name: "library"
    desc: "Shared code package"
  - name: "sdk"
    desc: "Generated client SDK"
  - name: "worker"
    desc: "Background job processor"
  - name: "migrator"
    desc: "Database migration service"

package_scripts:            # package.json "scripts" required per appType, enforced by `flisk doctor` — used in /docs/configuration/
  - type: "backend"
    scripts: "dev, build, start"
  - type: "worker"
    scripts: "dev, build, start"
  - type: "migrator"
    scripts: "dev, build, start"
  - type: "frontend"
    scripts: "dev, build"
  - type: "library"
    scripts: "dev, build"
  - type: "sdk"
    scripts: "dev, build"

# --- Licensing facts ---
# The free engine (docker-compose, npm, bun, etc.) needs no key at all to
# run. Premium keys unlock paid extras such as Verdaccio and use the
# project-ID limit as an anti-sharing guard.
premium_project_limit: 100   # Max distinct project IDs one premium license key covers

# --- Money facts ---
hours_per_week: 5          # recovered engineering hours per dev per week
hours_per_week_num: 5      # editable calculator starting value; not a typical measurement
weeks_per_year_num: 48     # working weeks in the ROI formula (numeric, JS)
work_hours_num: 2080       # working hours/year in the ROI formula (numeric, JS)
work_hours: "2,080"        # same, display form
cloud_cde_max: "$150"      # top of the Codespaces-class range, per dev/month
cloud_sandbox: "$500"      # hosted-sandbox alternative, per dev/month
team_price: 19             # Flisk Team, USD per dev per month
team_annual_10: "$2,280"   # 10 devs × team_price × 12 — keep in sync
community_price: "$0"      # Community tier / "Flisk itself costs…" claims
roi_net_default: "$147,720"  # calculator default: 10 devs × 5 h × 48 wk × $62.50/h − 10 × $19 × 12
roi_hours_default: "2,400"    # static placeholder before JS runs (10×5×48)
roi_prod_default: "$150,000"  # static placeholder before JS runs

# --- Example-scenario numbers (illustrative, kept consistent) ---
example_devs: 10           # "10 devs" scenario in pricing math + compare matrix
codespaces_range: "$60–150" # Codespaces full-time range, per dev/month
quickstart_time: "under 5 minutes" # Quick Start promise
brownfield_dirs: 31        # directories in the brownfield-rescue example
brownfield_found: 12       # manifests found there
brownfield_synth: 19       # manifests synthesized (dirs − found — keep in sync)
brownfield_artifacts: "372-527" # brownfield_dirs multiplied by the current 12-17 per-service range
brownfield_healthy: "31/31" # resources healthy in that example

# --- Installation commands ---
install_npm: "npm install -g @flisk-sh/flisk"
install_npx_version: "npx @flisk-sh/flisk --version"
install_npx_project: "npx @flisk-sh/flisk project --yes"
install_pnpm: "pnpm add -g @flisk-sh/flisk"
install_bun: "bun add -g @flisk-sh/flisk"
