# Canonical marketing numbers — SINGLE SOURCE OF TRUTH for the whole site.
# Change a value here and it updates on every page via {{ site.data.flisk.* }}.
# Every claim below is verified (Sept 2026). Do NOT invent new numbers in
# page HTML — add them here with a comment explaining the source.
#
# NOTE: _config.yml `description` (SEO meta) does NOT process Liquid -
# update it manually to match scale_services / files_per_service.

# --- Product facts (verified against repos on disk) ---
files_per_service: "12-17" # Current .autogenerated/ output range across SDK, backend, and frontend services
sdk_files: 12              # Verified in identity/identity-sdk/.autogenerated/
backend_files: 14          # Verified in identity/identity-management-backend/.autogenerated/
frontend_files: 17         # Verified in identity/identity-management-frontend/.autogenerated/
stack_artifacts: "40+"     # stack-wide: Tiltfile, C4, AGENTS.md, identities, registry, migrators
product_features: "35+"    # feature catalog on /features/
monorepo_services: 27      # service.json files parsed in beauty-crm (do not round this one)
scale_services: "100+"     # 100 microservices in flisk-erp-system, 27 in beauty-crm + platform infra
scale_plain: 100           # same, without "+" — for sentences where "+" reads badly
erp_services: 100          # exact count in flisk-erp-system
erp_domains: 7             # finance, hr, inventory, sales, manufacturing, supply_chain, analytics
erp_boot_seconds: 472      # clean GitHub runner, published CLI 1.3.72, images built from scratch, all 100 backends 2xx via Traefik
erp_boot_minutes: "about 8" # erp_boot_seconds in prose
erp_ci_run: "https://github.com/flisk-sh/flisk/actions/runs/36395860088"  # the run behind erp_boot_seconds

# --- Demo facts (the boot-demo stack) ---
demo_services: 14          # services in the demo stack shown in the terminal
demo_artifacts: "168-238"  # demo_services multiplied by the current 12-17 per-service range
demo_boot: "4.6s"          # warm start, images already existed; see docs/claims.md
demo_discovery: "212ms"    # discovery scan time shown in the terminal
demo_build: "1.8s"         # L4 build time shown in the terminal
boot_claim: "4.6s warm start" # permitted wording includes existing-image caveat
machine: "16 GB M1 MacBook"   # daily driver the demo was captured on

# --- Calculator parameters (UI bounds + defaults) ---
calc_devs_default: 10
calc_devs_min: 3
calc_devs_max: 120
calc_salary_default: 130000
calc_salary_display: "$130,000"
calc_salary_min: 60000
calc_salary_max: 250000
calc_salary_step: 5000

# --- Onboarding scenario assumptions (illustrative, not cohort measurements) ---
story_devs: 5              # example calculator scenario; user-adjustable
story_weeks: "two weeks"   # illustrative scenario; not a measured hiring cohort
wait_weeks_default: 2      # default "weeks blocked" in the Waiting-for-MVP calculator
setup_weeks: "2–6 weeks"   # example scenario assumption (stacking card)
onboard_days: "1–3 days"   # illustrative scenario; not a measured hiring cohort

# --- Third-party facts (researched, Sept 2026 — re-verify before campaigns) ---
tilt_stars: "9.4k"         # Tilt GitHub stars, "built on" claim
prereq_node: "22.12+"      # CLI npm package engine requirement
gitpod_entry: "$20"        # Gitpod/Ona Core entry, per month + compute credits
gitpod_annual_10: "$2,400 + compute" # 10 devs × gitpod_entry × 12
codespaces_hourly: "~$0.36/hr"      # 4-core Codespaces rate
codespaces_monthly: "~$58"          # ≈ full-time month at that rate
codespaces_annual_10: "~$7,000"     # 10 devs full-time, rounded
coder_monthly: "~$50"      # reported Premium per-user level, enterprise sale
coder_annual_10: "~$6,000" # 10 devs at that level, rounded
daytona_vcpu: "~$0.05/vCPU/hr"     # Daytona usage rate
daytona_monthly: "~$140"           # ≈ full-time 4-vCPU month at that rate
daytona_annual_10: "~$16,800"      # 10 devs full-time, rounded
okteto_free: "Free 5 seats"        # Okteto Starter tier
devbox_packages: "80,000+"         # Number of packages available via Nix
devbox_versions: "400,000+"        # Number of package versions available
devenv_languages: "58+"            # Number of supported languages
devenv_services: "42"               # Number of preconfigured services

