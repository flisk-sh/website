toolchain_chips:           # real generator outputs, bento strip on homepage
  - "Docker L1–L4 golden layers"
  - "Docker Compose ×8 variants"
  - "Tilt + Starlark engine"
  - "React or Vue 3 frontends (Vite)"
  - "Vite (frontend / backend / SDK / library)"
  - "TypeScript ×5 tsconfig variants"
  - "nginx"
  - "Traefik"
  - "Verdaccio local registry"
  - "Infisical machine identities"
  - "Prisma + DB migrator"
  - "Playwright E2E"
  - "PostgreSQL"
