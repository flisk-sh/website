title: Flisk CLI
tagline: The local runtime your AI agent can start, check and fix
email: hello@flisk.sh
lang: en_US
description: >-
  Flisk CLI runs your multi-service app on your machine from a Compose file or plain commands, and gives AI coding agents an MCP server to start it, read its health and logs, and fix what breaks. For containers it builds on Docker and Tilt. It is not a deploy tool. Production stays on Helm.
author:
  name: Flisk Team

# Published at the domain root (custom domain flisk.sh -> GitHub Pages, source path "/").
# Keep baseurl empty: a non-empty baseurl prefixes every internal link and asset with
# a path segment, which 404s on the root-served custom domain.
baseurl: ""
url: "https://flisk.sh"

twitter_username: brookservers
github_username: flisk-sh
social_image: "/assets/images/flisk-social-card.png?v=2"
logo: "/assets/images/flisk-social-card.png"

markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  docs:
    output: true
    permalink: /:collection/:path/
  features:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
    values:
      image: "/assets/images/flisk-social-card.png?v=2"
      sitemap: true
  - scope:
      path: "blog/articles"
    values:
      date: "2026-09-11"
      last_modified_at: "2026-09-11"
      sitemap: true
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "doc"
  - scope:
      path: "assets/images"
    values:
      sitemap: false
  - scope:
      path: "assets/social"
    values:
      sitemap: false

sass:
  style: compressed

include:
  - .well-known

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - test/
  - scripts/
  - README.md
  - ASAP_DOD_INSTALL_SMOKE.md
  - DESIGN.md
  - POSITIONING.md
  - EMAIL_SETUP.md
  - docker-compose.yml
  - Dockerfile

# Cookieless page and click analytics. Comment out to turn off; [data-cta] clicks are sent as a "cta" event.
plausible_domain: flisk.sh
