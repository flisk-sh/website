title: Flisk CLI
tagline: Turns service.json into a local Docker + Tilt stack
email: hello@flisk.sh
lang: en_US
description: >-
  Flisk CLI turns a service.json per service into a local Docker stack, with Tilt (the local development tool) watching services and live-updating containers as you code. It is not a deploy tool and not a Compose replacement. Production stays on Helm.
author:
  name: Flisk Team

# Published at the domain root (custom domain flisk.sh -> GitHub Pages, source path "/").
# Keep baseurl empty: a non-empty baseurl prefixes every internal link and asset with
# a path segment, which 404s on the root-served custom domain.
baseurl: ""
url: "https://flisk.sh"

twitter_username: brookservers
github_username: flisk-sh
social_image: "/assets/images/flisk-social-card.png"
logo: "/assets/images/flisk-social-card.png"

markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  docs:
    output: true
    permalink: /:collection/:path/
  features:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
    values:
      image: "/assets/images/flisk-social-card.png"
      sitemap: true
  - scope:
      path: "blog/articles"
    values:
      date: "2026-09-11"
      last_modified_at: "2026-09-11"
      sitemap: true
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "doc"
  - scope:
      path: "assets/images"
    values:
      sitemap: false
  - scope:
      path: "assets/social"
    values:
      sitemap: false

sass:
  style: compressed

include:
  - .well-known

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - test/
  - scripts/
  - README.md
  - ASAP_DOD_INSTALL_SMOKE.md
  - DESIGN.md
  - EMAIL_SETUP.md
  - docker-compose.yml
  - Dockerfile
